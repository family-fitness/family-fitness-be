name: backend-deploy

# main 에 BE 코드가 올라오면 시험을 돌리고, 통과하면 이미지를 만들어 Lightsail 서버에 띄운다.
# 서버 준비와 필요한 저장소 Secrets 는 deploy/README.md.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나씩. 도는 배포를 끊지 않고, 뒤에 온 것은 앞 배포가 끝나면 돈다
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/backend-ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}

    steps:
      - uses: actions/checkout@v7

      # GHCR 이미지 이름은 소문자여야 한다
      - name: Image name
        id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.LIGHTSAIL_HOST }}
      IMAGE: ${{ needs.image.outputs.image }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host lightsail\n  HostName %s\n  User ubuntu\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' "$HOST" > ~/.ssh/config

      # compose 파일도 코드와 같이 바뀌므로 배포마다 올린다. .env 는 서버에만 있고 건드리지 않는다
      - name: Upload compose files
        run: scp deploy/compose.yaml deploy/deploy.sh lightsail:/opt/familyfitness/

      # 서버는 이 작업의 GITHUB_TOKEN 으로 이미지를 받는다. 토큰은 작업이 끝나면 무효라 받은 뒤 로그아웃한다
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh lightsail "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh lightsail "bash /opt/familyfitness/deploy.sh '${IMAGE}'; status=\$?; docker logout ghcr.io; exit \$status"
