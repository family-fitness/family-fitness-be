spring.application.name=familyfitness
# 프로필을 지정하지 않으면 외부 의존성 없는 local(H2 인메모리)로 뜬다.
spring.profiles.default=local

spring.modulith.detection-strategy=explicitly-annotated

# Docker Compose 는 compose 프로필에서만 켠다 (local 은 H2 라 Docker 가 필요 없다)
spring.docker.compose.enabled=false

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=always
spring.mvc.problemdetails.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info,modulith

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.default-produces-media-type=application/json

app.timezone=Asia/Seoul
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.auth.jwt.issuer=familyfitness
app.auth.jwt.secret=${APP_JWT_SECRET:}
app.auth.jwt.access-ttl=PT1H
app.auth.jwt.refresh-ttl=P30D
app.auth.dev-login.enabled=false
app.auth.dev-auto-login.enabled=false
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.auth.google.token-uri=https://oauth2.googleapis.com/token
app.auth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# stub: AI 서비스 없이 결정적 가짜 응답 · http: {base-url}/v1 의 FastAPI 호출
app.ai.mode=${APP_AI_MODE:stub}
app.ai.base-url=${APP_AI_BASE_URL:http://localhost:8000}
# 코치 실행 파이프라인: 커밋 후 @Async 로 AI GET /v1/coach/runs/{id} 를 이 간격·횟수로 폴링한다 (계약: 1.5s · 40회)
app.coach.poll-interval-ms=1500
app.coach.max-polls=40
