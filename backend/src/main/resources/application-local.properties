# 외부 의존성 0개. H2 인메모리(PostgreSQL 호환 모드) + 샘플 시드 + 개발용 로그인.
spring.datasource.url=jdbc:h2:mem:familyfitness;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.locations=classpath:db/migration,classpath:db/seed

app.auth.jwt.secret=local-only-secret-change-me-local-only-secret-change-me-0123456789
app.auth.dev-login.enabled=true
app.ai.mode=stub

# curl · 스크립트용: X-Dev-User-Id 헤더를 보내면 그 계정(데모 부모 00000000-0000-4000-8000-000000000001 등)으로 인증한다.
# 헤더가 없으면 운영처럼 401 — 브라우저는 로그인 화면으로 가고, 개발용 계정(dev-login)으로 들어간다.
app.auth.dev-auto-login.enabled=true
app.cors.allowed-origins=*

# 초대 링크(shareUrl) 앞부분. FE 개발 서버(next dev)의 기본 포트가 3000 이다.
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

# 서버 시계를 앞으로 옮기고 건너뛴 정시 작업(알림 · 리그 정산 · 토큰 정리)을 원래 시각에 돌린다. POST /api/v1/dev/clock {"by":"P1D"}
app.dev.time-travel.enabled=true
