# 외부 의존성 0개. H2 인메모리(PostgreSQL 호환 모드) + 샘플 시드 + 개발용 로그인.
spring.datasource.url=jdbc:h2:mem:familyfitness;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.locations=classpath:db/migration,classpath:db/seed

app.auth.jwt.secret=local-only-secret-change-me-local-only-secret-change-me-0123456789
app.auth.dev-login.enabled=true
app.ai.mode=stub
