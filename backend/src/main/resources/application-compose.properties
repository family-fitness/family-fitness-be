# Docker Compose 의 PostgreSQL 을 spring-boot-docker-compose 가 띄우고 접속 정보를 주입한다.
spring.docker.compose.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

app.auth.jwt.secret=${APP_JWT_SECRET:local-only-secret-change-me-local-only-secret-change-me-0123456789}
app.auth.dev-login.enabled=true
app.auth.review-login.enabled=true

app.auth.dev-auto-login.enabled=true
app.cors.allowed-origins=*

# 초대 링크(shareUrl) 앞부분. FE 개발 서버(next dev)의 기본 포트가 3000 이다.
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

# 서버 시계를 앞으로 옮기고 건너뛴 정시 작업(알림 · 리그 정산 · 토큰 정리)을 원래 시각에 돌린다. POST /api/v1/dev/clock {"by":"P1D"}
app.dev.time-travel.enabled=true
