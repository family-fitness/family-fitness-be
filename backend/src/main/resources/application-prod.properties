spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.docker.compose.enabled=false
spring.h2.console.enabled=false

app.auth.dev-login.enabled=false
# 심사용 계정 로그인. 심사 기간이 끝나면 APP_AUTH_REVIEW_LOGIN_ENABLED=false 로 끈다.
app.auth.review-login.enabled=${APP_AUTH_REVIEW_LOGIN_ENABLED:true}
# 브라우저 요청은 늘 Next 서버(FE rewrites)를 거쳐 온다. Tomcat 이 믿을 프록시가 붙인 X-Forwarded-For 에서 브라우저 IP 를 꺼내
# remoteAddr 로 쓰게 한다 — 안 그러면 심사용 로그인 IP 한도를 모든 사람이 Next 서버 IP 하나로 나눠 쓴다.
# 믿을 프록시는 Tomcat 기본값(루프백 · 사설망)이다. Next 서버가 공인 IP 로 들어오면 SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES 에 그 주소(정규식)를 준다.
server.forward-headers-strategy=native
app.dev.time-travel.enabled=false
app.ai.mode=${APP_AI_MODE:http}
# 초대 링크의 앞머리. 기본값을 두지 않는다 — 빠뜨리면 localhost 링크가 나가는 대신 기동이 멈춘다(AppProperties).
app.frontend-base-url=${APP_FRONTEND_BASE_URL:}
# actuator 는 health 만 연다. info · modulith(모듈 · 패키지 구조와 모듈 사이 의존)는 local · compose 에서만 본다 —
# 심사용 로그인으로 누구나 토큰을 받을 수 있어 로그인한 사람에게만 여는 것으로는 막지 못한다.
management.endpoints.web.exposure.include=health
