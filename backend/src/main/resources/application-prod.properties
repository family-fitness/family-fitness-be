spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.docker.compose.enabled=false
spring.h2.console.enabled=false

app.auth.dev-login.enabled=false
app.dev.time-travel.enabled=false
app.ai.mode=${APP_AI_MODE:http}
# 초대 링크의 앞머리. 기본값을 두지 않는다 — 빠뜨리면 localhost 링크가 나가는 대신 기동이 멈춘다(AppProperties).
app.frontend-base-url=${APP_FRONTEND_BASE_URL:}
