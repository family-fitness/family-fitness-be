spring.datasource.url=jdbc:h2:mem:familyfitness-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.docker.compose.enabled=false
spring.flyway.locations=classpath:db/migration,classpath:db/seed
# 알림을 부른 스레드에서 곧바로 쓴다 — 커밋한 행을 시험 끝에 지우는 시험들이 뒤늦게 들어온 알림 행과 엇갈리지 않게.
# 비동기 쪽은 NotificationConcurrencyTest 가 이 값을 true 로 바꿔 본다.
app.notification.executor.async=false

app.auth.jwt.secret=test-only-secret-test-only-secret-test-only-secret-0123456789abcdef
app.auth.dev-login.enabled=true
app.ai.mode=stub
app.cors.allowed-origins=http://localhost:5173
